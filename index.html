<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONEKTA - Terhubung Lebih Dekat</title>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://appkonekta.fun/">
    <meta property="og:title" content="KONEKTA - Terhubung Lebih Dekat">
    <meta property="og:description" content="Satu Aplikasi, Ribuan Koneksi. Gabung komunitas, kumpulkan poin, dan tukarkan manfaatnya!">
    <meta property="og:image" content="https://appkonekta.fun/logo.png"> 
    
    <link rel="icon" href="logo.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --primary: #0f766e; }
        body { background-color: #f0fdf4; font-family: ui-sans-serif, system-ui, sans-serif; color: #111827; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .swal2-popup { border-radius: 20px !important; }
        .swal2-title { font-weight: 900 !important; color: var(--primary) !important; }
        
        /* Style Autocomplete */
        .suggestions-list {
            position: absolute; background: white; border: 2px solid #e5e7eb; border-top: none;
            border-radius: 0 0 1rem 1rem; width: 100%; max-height: 200px; overflow-y: auto;
            z-index: 50; display: none; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .suggestion-item { padding: 12px; font-size: 12px; font-weight: bold; color: #374151; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
        .suggestion-item:hover { background-color: #f0fdf4; color: #0f766e; }
        .suggestion-item:last-child { border-bottom: none; }
    </style>
</head>
<body class="pb-24 min-h-screen flex items-center justify-center">

    <div id="tab-awal" class="p-6 w-full max-w-md mx-auto text-center">
        <div class="mb-10 pt-4 flex flex-col items-center">
            <img src="https://appkonekta.fun/logo.png" alt="Logo KONEKTA" class="w-24 h-auto mb-4 object-contain drop-shadow-sm" onerror="this.style.display='none'">
            <h1 class="text-5xl font-black text-[#0f766e] tracking-tighter mb-2">KONEKTA</h1>
            <p class="text-gray-500 text-sm font-medium tracking-widest uppercase">Terhubung Lebih Dekat</p>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-green-100 text-left relative z-10">
            <div class="flex bg-gray-50 rounded-full p-1 mb-6 text-center">
                <button id="btn-auth-member" onclick="toggleAuth('member')" class="flex-1 py-3 rounded-full text-[11px] font-black bg-white shadow-sm text-[#0f766e] uppercase tracking-wide transition-all">Konektor</button>
                <button id="btn-auth-gm" onclick="toggleAuth('gm')" class="flex-1 py-3 rounded-full text-[11px] font-black text-gray-400 uppercase tracking-wide transition-all">Game Master</button>
            </div>

            <div id="form-member">
                <div id="member-register-fields" class="space-y-4">
                    <input type="text" id="reg-name" placeholder="Nama Lengkap" class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:border-[#0f766e] focus:bg-white transition-all font-bold text-gray-700">
                    <input type="text" inputmode="numeric" id="reg-nik" placeholder="NIK (16 Digit)" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 16)" class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:border-[#0f766e] focus:bg-white transition-all font-bold text-gray-700">
                    
                    <div class="relative w-full">
                        <input type="text" id="reg-domicile-input" placeholder="Ketik Kecamatan / Kelurahan..." autocomplete="off" class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:border-[#0f766e] focus:bg-white transition-all font-bold text-gray-700 text-sm placeholder:font-normal placeholder:text-gray-400">
                        <div id="domicile-suggestions" class="suggestions-list"></div>
                    </div>

                    <input type="text" inputmode="numeric" id="reg-wa" placeholder="No. WhatsApp" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:border-[#0f766e] focus:bg-white transition-all font-bold text-gray-700">
                    <button id="btn-daftar" onclick="prosesDaftar()" class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 text-white py-4 rounded-2xl font-black uppercase text-xs active:scale-95 transition-all shadow-lg mt-2 tracking-widest">Gabung Jadi Konektor</button>
                    <button onclick="toggleMemberView('login')" class="text-[#0f766e] text-[10px] font-black uppercase underline mt-4 block mx-auto italic text-center">Masuk dengan NIK</button>
                </div>

                <div id="member-login-fields" class="hidden space-y-3 text-center">
                    <input type="text" inputmode="numeric" id="login-nik" placeholder="16 Digit NIK" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 16)" class="w-full p-5 bg-gray-50 rounded-2xl border-2 border-gray-200 focus:border-[#0f766e] focus:bg-white outline-none text-center font-black text-lg tracking-widest text-[#0f766e] transition-all">
                    <button onclick="restoreByNIK()" class="w-full bg-[#0f766e] text-white py-4 rounded-2xl font-black uppercase text-xs active:scale-95 shadow-lg transition-transform">Masuk Aplikasi</button>
                    <button onclick="toggleMemberView('register')" class="text-gray-400 text-[10px] font-bold uppercase mt-4 block mx-auto italic text-center hover:text-gray-600">Kembali Mendaftar</button>
                </div>
            </div>

            <div id="form-gm" class="hidden space-y-4">
                <input type="text" id="gm-user" placeholder="Username GM" class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:border-[#0f766e] focus:bg-white transition-all font-bold text-gray-700">
                <input type="password" id="gm-pass" placeholder="Password" class="w-full p-4 bg-gray-50 rounded-2xl border-2 border-gray-200 outline-none focus:border-[#0f766e] focus:bg-white transition-all font-bold text-gray-700">
                <button onclick="loginAdmin()" class="w-full bg-gray-800 text-white py-4 rounded-2xl font-bold uppercase text-xs active:scale-95 shadow-lg transition-transform hover:bg-gray-900">Login Console</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        
        // Tambahkan getDoc untuk mengecek database admin
        import { doc, getDoc, setDoc, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Data Lokasi Surabaya
        const SURABAYA_LOCATIONS = [
            "(Asemrowo) Asemrowo", "(Asemrowo) Genting Kalianak", "(Asemrowo) Tambak Sarioso",
            "(Benowo) Kandangan", "(Benowo) Romokalisari", "(Benowo) Sememi", "(Benowo) Tambak Oso Wilangon",
            "(Bubutan) Alon-Alon Contong", "(Bubutan) Bubutan", "(Bubutan) Gundih", "(Bubutan) Jepara", "(Bubutan) Tembok Dukuh",
            "(Bulak) Bulak", "(Bulak) Kedung Cowek", "(Bulak) Kenjeran", "(Bulak) Sukolilo Baru",
            "(Dukuh Pakis) Dukuh Kupang", "(Dukuh Pakis) Dukuh Pakis", "(Dukuh Pakis) Gunungsari", "(Dukuh Pakis) Pradahkali Kendal",
            "(Gayungan) Dukuh Menanggal", "(Gayungan) Gayungan", "(Gayungan) Ketintang", "(Gayungan) Menanggal",
            "(Genteng) Embong Kaliasin", "(Genteng) Genteng", "(Genteng) Kapasari", "(Genteng) Ketabang", "(Genteng) Peneleh",
            "(Gubeng) Airlangga", "(Gubeng) Baratajaya", "(Gubeng) Gubeng", "(Gubeng) Kertajaya", "(Gubeng) Mojo", "(Gubeng) Pucang Sewu",
            "(Gunung Anyar) Gunung Anyar", "(Gunung Anyar) Gunung Anyar Tambak", "(Gunung Anyar) Rungkut Menanggal", "(Gunung Anyar) Rungkut Tengah",
            "(Jambangan) Jambangan", "(Jambangan) Karah", "(Jambangan) Kebonsari", "(Jambangan) Pagesangan",
            "(Karang Pilang) Karang Pilang", "(Karang Pilang) Kebraon", "(Karang Pilang) Kedurus", "(Karang Pilang) Warugunung",
            "(Kenjeran) Bulak Banteng", "(Kenjeran) Sidotopo Wetan", "(Kenjeran) Tambak Wedi", "(Kenjeran) Tanah Kali Kedinding",
            "(Krembangan) Dupak", "(Krembangan) Kemayoran", "(Krembangan) Krembangan Selatan", "(Krembangan) Morokrembangan", "(Krembangan) Perak Barat",
            "(Lakarsantri) Bangkingan", "(Lakarsantri) Jeruk", "(Lakarsantri) Lakarsantri", "(Lakarsantri) Lidah Kulon", "(Lakarsantri) Lidah Wetan", "(Lakarsantri) Sumur Welut",
            "(Mulyorejo) Dukuh Sutorejo", "(Mulyorejo) Kalijudan", "(Mulyorejo) Kalisari", "(Mulyorejo) Kejawen Putih Tambak", "(Mulyorejo) Manyar Sabrangan", "(Mulyorejo) Mulyorejo",
            "(Pabean Cantian) Bongkaran", "(Pabean Cantian) Krembangan Utara", "(Pabean Cantian) Nyamplungan", "(Pabean Cantian) Perak Timur", "(Pabean Cantian) Perak Utara",
            "(Pakal) Babat Jerawat", "(Pakal) Benowo", "(Pakal) Pakal", "(Pakal) Sumberrejo",
            "(Rungkut) Kali Rungkut", "(Rungkut) Kedung Baruk", "(Rungkut) Medokan Ayu", "(Rungkut) Penjaringan Sari", "(Rungkut) Rungkut Kidul", "(Rungkut) Wonorejo Rungkut",
            "(Sambikerep) Bringin", "(Sambikerep) Lontar", "(Sambikerep) Made", "(Sambikerep) Sambikerep",
            "(Sawahan) Banyu Urip", "(Sawahan) Kupang Krajan", "(Sawahan) Pakis", "(Sawahan) Petemon", "(Sawahan) Putat Jaya", "(Sawahan) Sawahan",
            "(Semampir) Ampel", "(Semampir) Pegirian", "(Semampir) Sidotopo", "(Semampir) Ujung", "(Semampir) Wonokusumo",
            "(Simokerto) Kapasan", "(Simokerto) Sidodadi", "(Simokerto) Simokerto", "(Simokerto) Simolawang", "(Simokerto) Tambakrejo",
            "(Suko Manunggal) Putat Gede", "(Suko Manunggal) Simomulyo", "(Suko Manunggal) Simomulyo Baru", "(Suko Manunggal) Sono Kwijenan", "(Suko Manunggal) Suko Manunggal", "(Suko Manunggal) Tanjungsari",
            "(Sukolilo) Gebang Putih", "(Sukolilo) Keputih", "(Sukolilo) Klampis Ngasem", "(Sukolilo) Medokan Semampir", "(Sukolilo) Menur Pumpungan", "(Sukolilo) Ngiden Jangkungan", "(Sukolilo) Semolowaru",
            "(Tambaksari) Dukuh Setro", "(Tambaksari) Gading", "(Tambaksari) Kapasmadya Baru", "(Tambaksari) Pacar Keling", "(Tambaksari) Pacar Kembang", "(Tambaksari) Ploso", "(Tambaksari) Rangkah", "(Tambaksari) Tambaksari",
            "(Tandes) Balongsari", "(Tandes) Banjar Sugihan", "(Tandes) Karangpoh", "(Tandes) Manukan Kulon", "(Tandes) Manukan Wetan", "(Tandes) Tandes",
            "(Tegalsari) Dr. Sutomo", "(Tegalsari) Kedungdoro", "(Tegalsari) Keputran", "(Tegalsari) Tegalsari", "(Tegalsari) Wonorejo Tegalsari",
            "(Tenggilis Mejoyo) Kendangsari", "(Tenggilis Mejoyo) Kutisari", "(Tenggilis Mejoyo) Panjang Jiwo", "(Tenggilis Mejoyo) Tenggilis Mejoyo",
            "(Wiyung) Babatan", "(Wiyung) Balas Klumprik", "(Wiyung) Jajar Tunggal", "(Wiyung) Wiyung",
            "(Wonocolo) Bendul Merisi", "(Wonocolo) Jemur Wonosari", "(Wonocolo) Margorejo", "(Wonocolo) Sidosermo", "(Wonocolo) Siwalankerto",
            "(Wonokromo) Darmo", "(Wonokromo) Jagir", "(Wonokromo) Ngagel", "(Wonokromo) Ngagelrejo", "(Wonokromo) Sawunggaling", "(Wonokromo) Wonokromo",
            "LUAR SURABAYA"
        ];

        function setupAutocomplete() {
            const input = document.getElementById('reg-domicile-input');
            const suggestionsBox = document.getElementById('domicile-suggestions');

            input.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                suggestionsBox.innerHTML = '';
                if (query.length < 2) { suggestionsBox.style.display = 'none'; return; }

                const matches = SURABAYA_LOCATIONS.filter(loc => loc.toLowerCase().includes(query));
                
                if (matches.length > 0) {
                    suggestionsBox.style.display = 'block';
                    matches.forEach(match => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.textContent = match;
                        div.onclick = function() {
                            input.value = match;
                            suggestionsBox.style.display = 'none';
                        };
                        suggestionsBox.appendChild(div);
                    });
                } else {
                    suggestionsBox.style.display = 'none';
                }
            });

            document.addEventListener('click', function(e) {
                if (e.target !== input) suggestionsBox.style.display = 'none';
            });
        }

        window.toggleAuth = (t) => {
            document.getElementById('form-member').classList.toggle('hidden', t !== 'member');
            document.getElementById('form-gm').classList.toggle('hidden', t !== 'gm');
            
            const btnMember = document.getElementById('btn-auth-member');
            const btnGm = document.getElementById('btn-auth-gm');
            
            if (t === 'member') {
                btnMember.className = "flex-1 py-3 rounded-full text-[11px] font-black bg-white shadow-sm text-[#0f766e] uppercase tracking-wide transition-all";
                btnGm.className = "flex-1 py-3 rounded-full text-[11px] font-black text-gray-400 uppercase tracking-wide transition-all";
            } else {
                btnGm.className = "flex-1 py-3 rounded-full text-[11px] font-black bg-white shadow-sm text-[#0f766e] uppercase tracking-wide transition-all";
                btnMember.className = "flex-1 py-3 rounded-full text-[11px] font-black text-gray-400 uppercase tracking-wide transition-all";
            }
        };

        window.toggleMemberView = (m) => { 
            document.getElementById('member-register-fields').classList.toggle('hidden', m === 'login'); 
            document.getElementById('member-login-fields').classList.toggle('hidden', m !== 'login'); 
        };

        window.prosesDaftar = async () => {
            const n = document.getElementById('reg-name').value;
            const nik = document.getElementById('reg-nik').value;
            const dom = document.getElementById('reg-domicile-input').value;
            const wa = document.getElementById('reg-wa').value;
            const btn = document.getElementById('btn-daftar');

            if(!n || nik.length!==16 || !dom) return Swal.fire("Gagal", "Data tidak lengkap atau NIK kurang dari 16 digit!", "warning");
            if(!SURABAYA_LOCATIONS.includes(dom)) return Swal.fire("Wilayah Invalid", "Silakan pilih wilayah dari rekomendasi yang muncul saat diketik!", "warning");
            
            btn.innerText = "Mendaftarkan...";
            
            try {
                const id = `MS${nik.slice(-4)}${Date.now().toString().slice(-4)}`;
                
                await setDoc(doc(db, "users", id), { 
                    name: n, 
                    nik: nik, 
                    domicile: dom, 
                    whatsapp: wa, 
                    points: 10, 
                    role: 'member', 
                    presence_count: 0 
                });
                
                localStorage.setItem('ms_user_id', id); 
                localStorage.setItem('ms_role', 'member'); 
                window.location.href = "member.html";
            } catch(e) { 
                Swal.fire("Error", e.message, "error"); 
                btn.innerText = "Gabung Jadi Konektor";
            }
        };

        window.restoreByNIK = async () => {
            const nik = document.getElementById('login-nik').value;
            const btn = document.querySelector('#member-login-fields button');
            
            if(nik.length !== 16) return Swal.fire("Gagal", "NIK harus 16 digit!", "warning");
            
            btn.innerText = "Mencari Data...";
            
            try {
                const q = query(collection(db, "users"), where("nik", "==", nik), limit(1));
                const snap = await getDocs(q);
                
                if(!snap.empty) { 
                    localStorage.setItem('ms_user_id', snap.docs[0].id); 
                    localStorage.setItem('ms_role', 'member'); 
                    window.location.href = "member.html";
                } else { 
                    Swal.fire("Gagal", "NIK tidak ditemukan, silakan mendaftar.", "error"); 
                }
            } catch(e) {
                Swal.fire("Error", e.message, "error");
            } finally {
                btn.innerText = "Masuk Aplikasi";
            }
        };

        // LOGIKA BARU: MULTI-ADMIN LOGIN
        window.loginAdmin = async () => {
            const u = document.getElementById('gm-user').value;
            const p = document.getElementById('gm-pass').value;
            const btn = document.querySelector('#form-gm button');
            
            if (!u || !p) return Swal.fire("Gagal", "Username dan Password wajib diisi!", "warning");
            
            btn.innerText = "Memeriksa...";
            
            try {
                // 1. Jalur Darurat: Super GM Pusat (Bawaan)
                if(u === "supergm" && btoa(p) === "amFudWFyaTIwMjY=") { 
                    localStorage.setItem('ms_role', 'super_gm'); 
                    localStorage.setItem('ms_admin_name', 'Pusat Komando');
                    localStorage.setItem('ms_admin_wa', '6281339760265'); // WA Admin Pusat
                    window.location.href = "gm.html";
                    return;
                }
                
                // 2. Jalur Korlap: Cek di database 'admins'
                const adminRef = doc(db, "admins", u);
                const adminSnap = await getDoc(adminRef);
                
                if (adminSnap.exists()) {
                    const data = adminSnap.data();
                    // Pencocokan password
                    if (data.password === p) {
                        localStorage.setItem('ms_role', 'gm'); // Status Korlap Biasa
                        localStorage.setItem('ms_admin_id', u); // Username mereka
                        localStorage.setItem('ms_admin_name', data.name);
                        localStorage.setItem('ms_admin_wa', data.wa);
                        window.location.href = "gm.html";
                    } else {
                        Swal.fire("Ditolak", "Password salah!", "error");
                    }
                } else {
                    Swal.fire("Ditolak", "Username Korlap tidak ditemukan!", "error");
                }
            } catch (e) {
                Swal.fire("Error", "Gagal menghubungi server.", "error");
                console.error(e);
            } finally {
                btn.innerText = "Login Console";
            }
        };

        function checkSession() {
            const role = localStorage.getItem('ms_role');
            if (role === 'member' && localStorage.getItem('ms_user_id')) {
                window.location.href = "member.html";
            } else if (role === 'gm' || role === 'super_gm') {
                window.location.href = "gm.html";
            } else {
                setupAutocomplete();
            }
        }

        checkSession();
        
    </script>
</body>
</html>
